plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    // CurseForge-only mods, for the compat recipe test (-PcompatTest)
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseMaven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

base {
    // adastraplanets-<minecraft version>-<mod version>.jar
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // generates every landmark in a fresh world, checks it, logs "[verify]" lines and closes (StructureVerifier)
        verifyStructures {
            client()
            gameDirectory = project.file('run/verify')
            systemProperty 'adastraplanets.verifyStructures', 'true'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--existing-mod', 'ad_astra', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime' = present in dev runs, never published as a dependency.
// 'nestedLibs' = mods whose jar-in-jar libraries must be on the compile classpath (FML loads them at runtime).
configurations {
    runtimeClasspath.extendsFrom localRuntime
    nestedLibs { transitive = false }
}

var extractNestedLibs = tasks.register('extractNestedLibs', Sync) {
    from(configurations.nestedLibs.files.collect { zipTree(it) }) {
        include 'META-INF/jars/*.jar'
        eachFile { path = name }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('nestedLibs')
}

dependencies {
    // Ad Astra and its required libraries
    implementation "maven.modrinth:ad-astra:${ad_astra_version}"
    implementation "maven.modrinth:resourceful-lib:${resourceful_lib_version}"
    implementation "maven.modrinth:resourceful-config:${resourceful_config_version}"
    implementation "maven.modrinth:common-storage-lib:${common_storage_lib_version}"
    nestedLibs "maven.modrinth:common-storage-lib:${common_storage_lib_version}"
    compileOnly fileTree(layout.buildDirectory.dir('nestedLibs')) { include '*.jar'; builtBy extractNestedLibs }

    // Entity models and animations
    implementation "maven.modrinth:geckolib:${geckolib_version}"

    // KubeJS: optional integration, compiled against but only loaded when present
    compileOnly "maven.modrinth:kubejs:${kubejs_version}"
    compileOnly "maven.modrinth:rhino:${rhino_version}"
    localRuntime "maven.modrinth:kubejs:${kubejs_version}"
    localRuntime "maven.modrinth:rhino:${rhino_version}"
    localRuntime "maven.modrinth:better-advanced-tooltips:${better_advanced_tooltips_version}"

    // Curios: optional; gives the environmental liner its four slots (without it the liner system is off)
    compileOnly "maven.modrinth:curios:${curios_version}"
    localRuntime "maven.modrinth:curios:${curios_version}"

    // Recipe viewer for testing in dev
    // JEI: compiled against for the workbench categories (loaded only when JEI is installed)
    compileOnly "maven.modrinth:jei:${jei_version}"
    localRuntime "maven.modrinth:jei:${jei_version}"

    // Mystical Agriculture: compiled against for its crop plugin (found and loaded only by Mystical Agriculture itself)
    compileOnly "maven.modrinth:mystical-agriculture:${mystical_agriculture_version}"
    compileOnly "maven.modrinth:cucumber:${cucumber_version}"

    // Tech mods our optional compat recipes are for: only with -PcompatTest, to check those recipes load
    // (./gradlew runGameTestServer -PcompatTest); never needed to build or play
    if (project.hasProperty('compatTest')) {
        localRuntime "maven.modrinth:create:${create_version}"
        localRuntime "maven.modrinth:mekanism:${mekanism_version}"
        localRuntime "maven.modrinth:immersiveengineering:${immersive_engineering_version}"
        localRuntime "maven.modrinth:guideme:${guideme_version}"
        localRuntime "maven.modrinth:modern-industrialization:${modern_industrialization_version}"
        localRuntime "maven.modrinth:ae2:${ae2_version}"
        localRuntime "maven.modrinth:refined-storage:${refined_storage_version}"
        localRuntime "maven.modrinth:cucumber:${cucumber_version}"
        localRuntime "maven.modrinth:mystical-agriculture:${mystical_agriculture_version}"
        localRuntime "maven.modrinth:productivebees:${productive_bees_version}"
        localRuntime "maven.modrinth:placebo:${placebo_version}"
        localRuntime "maven.modrinth:patchouli:${patchouli_version}"
        localRuntime "maven.modrinth:apothic-attributes:${apothic_attributes_version}"
        localRuntime "maven.modrinth:apothic-spawners:${apothic_spawners_version}"
        localRuntime "maven.modrinth:apothic-enchanting:${apothic_enchanting_version}"
        localRuntime "maven.modrinth:apotheosis:${apotheosis_version}"
        localRuntime "maven.modrinth:codechicken-lib:${codechicken_lib_version}"
        localRuntime "maven.modrinth:brandons-core:${brandons_core_version}"
        localRuntime "maven.modrinth:draconic-evolution:${draconic_evolution_version}"
        localRuntime "maven.modrinth:enderio:${enderio_version}"
        localRuntime "maven.modrinth:titanium:${titanium_version}"
        localRuntime "maven.modrinth:industrial-foregoing:${industrial_foregoing_version}"
        localRuntime "maven.modrinth:replication:${replication_version}"
        localRuntime "maven.modrinth:pneumaticcraft-repressurized:${pneumaticcraft_version}"
        localRuntime "maven.modrinth:mcjtylib:${mcjtylib_version}"
        localRuntime "maven.modrinth:rftools-base:${rftools_base_version}"
        localRuntime "maven.modrinth:rftools-builder:${rftools_builder_version}"
        localRuntime "curse.maven:productive-metalworks-1184570:${productive_metalworks_file}"
        localRuntime "maven.modrinth:athena-ctm:${athena_version}"
        localRuntime "curse.maven:hephaestus-forge-1542467:${hephaestus_forge_file}"
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            ad_astra_version_range : ad_astra_version_range,
            geckolib_version_range : geckolib_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// the license travels inside the jar
tasks.named('jar') {
    from('LICENSE.md')
}
